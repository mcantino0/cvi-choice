<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVI Choice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .screen {
            display: none !important;
            width: 100%;
            max-width: 1000px;
        }

        .screen.active {
            display: flex !important;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        .title-screen {
            text-align: center;
        }

        .title-screen img {
            max-width: 100%;
            height: auto;
            cursor: pointer;
            border: 3px solid transparent;
        }

        .title-screen img:focus {
            outline: none;
            border-color: #ffff00;
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.8);
        }

        .choices-screen {
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 60px;
            flex-wrap: wrap;
        }

        .screen.active.choices-screen {
            flex-direction: row;
        }

        .choice-button {
            background: none;
            border: 3px solid transparent;
            cursor: pointer;
            padding: 10px;
            transition: all 0.2s;
        }

        .choice-button img {
            max-width: 300px;
            height: auto;
            display: block;
        }

        .choice-button:focus {
            outline: none;
            border-color: #ffff00;
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.8);
        }

        .choice-button:active {
            transform: scale(0.95);
        }

        .video-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: rgba(255, 255, 0, 0.3);
            color: #ffff00;
            border: 2px solid #ffff00;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        .back-button:focus {
            outline: none;
            background-color: #ffff00;
            color: #000;
        }
    </style>
</head>
<body>
    <!-- Title Screen -->
    <div class="screen title-screen active" id="screen-title">
        <img src="My Apps Title.png" alt="My Apps Title - Press Enter to continue" tabindex="0">
    </div>

    <!-- Screen 1: Picture1 or Next -->
    <div class="screen choices-screen" id="screen-1">
        <button class="choice-button" aria-label="Picture 1 - Opens YouTube video">
            <img src="Picture1.png" alt="Picture 1">
        </button>
        <button class="choice-button next-button" aria-label="Next - Go to next set of options">
            <img src="next.png" alt="Next">
        </button>
    </div>

    <!-- Screen 2: Picture2 or Next -->
    <div class="screen choices-screen" id="screen-2">
        <button class="choice-button" aria-label="Picture 2 - Opens YouTube video">
            <img src="Picture2.png" alt="Picture 2">
        </button>
        <button class="choice-button next-button" aria-label="Next - Go to next set of options">
            <img src="next.png" alt="Next">
        </button>
    </div>

    <!-- Screen 3: Picture3 or Next -->
    <div class="screen choices-screen" id="screen-3">
        <button class="choice-button" aria-label="Picture 3 - Opens YouTube video">
            <img src="Picture3.png" alt="Picture 3">
        </button>
        <button class="choice-button next-button" aria-label="Next - Go to next set of options">
            <img src="next.png" alt="Next">
        </button>
    </div>

    <!-- Screen 4: Picture4 or Back to Start -->
    <div class="screen choices-screen" id="screen-4">
        <button class="choice-button" aria-label="Picture 4 - Opens YouTube video">
            <img src="Picture4.png" alt="Picture 4">
        </button>
        <button class="choice-button next-button" aria-label="Back - Return to title screen">
            <img src="next.png" alt="Back">
        </button>
    </div>

    <!-- Video Player Screen -->
    <div class="screen" id="screen-video">
        <button class="back-button" aria-label="Close video and go back">Close Video (Esc)</button>
        <div class="video-container" id="video-container">
            <div id="video-player"></div>
        </div>
    </div>

    <script>
        let currentScreen = 'title';
        let previousScreen = 'screen-1'; // Track which screen to return to from video
        const screens = {
            'title': document.getElementById('screen-title'),
            'screen-1': document.getElementById('screen-1'),
            'screen-2': document.getElementById('screen-2'),
            'screen-3': document.getElementById('screen-3'),
            'screen-4': document.getElementById('screen-4'),
            'video': document.getElementById('screen-video')
        };

        // YouTube API initialization code no longer needed
        // Videos are loaded dynamically using iframes and video tags

        function showScreen(screenName) {
            Object.values(screens).forEach(screen => screen.classList.remove('active'));
            screens[screenName].classList.add('active');
            
            // Track previous screen for returning from video
            if (screenName === 'video') {
                previousScreen = currentScreen;
            }
            
            currentScreen = screenName;
            
            // Focus the first focusable element on the new screen
            setTimeout(() => {
                const focusableElements = screens[screenName].querySelectorAll('button, img[tabindex], [tabindex="0"]');
                if (focusableElements.length > 0) {
                    focusableElements[0].focus();
                }
            }, 100);
        }

        // Handle Tab key to trap focus within the current screen
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                const activeScreen = screens[currentScreen];
                const focusableElements = Array.from(activeScreen.querySelectorAll('button, img[tabindex], [tabindex="0"]'));
                
                if (focusableElements.length === 0) return;
                
                const currentFocusedElement = document.activeElement;
                const currentIndex = focusableElements.indexOf(currentFocusedElement);
                
                // Tab key (forward navigation)
                if (!e.shiftKey) {
                    if (currentIndex === focusableElements.length - 1) {
                        e.preventDefault();
                        focusableElements[0].focus();
                    }
                }
                // Shift+Tab key (backward navigation)
                else {
                    if (currentIndex === 0 || currentIndex === -1) {
                        e.preventDefault();
                        focusableElements[focusableElements.length - 1].focus();
                    }
                }
            }
        });

        // Title screen handling
        const titleImg = document.querySelector('#screen-title img');
        titleImg.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                showScreen('screen-1');
            }
        });

        titleImg.addEventListener('click', (e) => {
            e.preventDefault();
            showScreen('screen-1');
        });

        // Set up choice buttons for each screen
        const screenChoices = [
            { screenId: 'screen-1', nextScreen: 'screen-2', videoUrl: 'https://www.you-tu.be/watch?v=O610FzBWs5A' },
            { screenId: 'screen-2', nextScreen: 'screen-3', videoUrl: 'https://www.you-tu.be/watch?v=O610FzBWs5A' },
            { screenId: 'screen-3', nextScreen: 'screen-4', videoUrl: 'https://www.you-tu.be/watch?v=O610FzBWs5A' },
            { screenId: 'screen-4', nextScreen: 'title', videoUrl: 'https://www.you-tu.be/watch?v=O610FzBWs5A' }
        ];

        // Extract YouTube video ID from URL
        function extractYouTubeId(url) {
            if (!url) return null;
            // Handle different YouTube URL formats including you-tu.be
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|you-tu\.be\/)([^&\n?#]+)/,
                /^([a-zA-Z0-9_-]{11})$/ // Just the ID
            ];
            for (let pattern of patterns) {
                const match = url.match(pattern);
                if (match && match[1]) return match[1];
            }
            return null;
        }

        // Determine video type and build appropriate player HTML
        function getVideoPlayerHTML(videoUrl) {
            if (!videoUrl) return '';
            
            // For custom domains like you-tu.be, load directly as iframe
            if (videoUrl.includes('you-tu.be')) {
                // Load the URL directly as an iframe
                return `<iframe width="100%" height="100%" src="${videoUrl}" frameborder="0" allowfullscreen allow="autoplay"></iframe>`;
            }
            
            // Handle standard YouTube URLs
            const youtubeId = extractYouTubeId(videoUrl);
            if (youtubeId) {
                return `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${youtubeId}?autoplay=1&fs=1&modestbranding=1" frameborder="0" allowfullscreen allow="autoplay"></iframe>`;
            }
            
            // Check if it's a Vimeo URL
            const vimeoMatch = videoUrl.match(/vimeo\.com\/(\d+)/);
            if (vimeoMatch) {
                return `<iframe width="100%" height="100%" src="https://player.vimeo.com/video/${vimeoMatch[1]}?autoplay=1" frameborder="0" allowfullscreen allow="autoplay"></iframe>`;
            }
            
            // Assume it's a direct video file URL
            return `<video width="100%" height="100%" controls autoplay><source src="${videoUrl.replace(/"/g, '&quot;')}" type="video/mp4"><source src="${videoUrl.replace(/"/g, '&quot;')}" type="video/webm">Your browser does not support video playback.</video>`;
        }

        screenChoices.forEach(({ screenId, nextScreen, videoUrl }) => {
            const screen = document.getElementById(screenId);
            const buttons = screen.querySelectorAll('.choice-button');
            
            buttons.forEach((button, index) => {
                button.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (button.classList.contains('next-button')) {
                            showScreen(nextScreen);
                        } else {
                            showScreen('video');
                        }
                    }
                });

                button.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (button.classList.contains('next-button')) {
                        showScreen(nextScreen);
                    } else {
                        showScreen('video');
                    }
                });
            });
        });

        // Video screen handling
        const backButton = document.querySelector('.back-button');
        backButton.addEventListener('click', () => {
            showScreen(previousScreen);
        });

        backButton.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                showScreen(previousScreen);
            }
        });

        // Close video with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && currentScreen === 'video') {
                showScreen(previousScreen);
            }
        });

        // Auto-focus the title image when page loads
        window.addEventListener('load', () => {
            const titleImg = document.querySelector('#screen-title img');
            if (titleImg) {
                titleImg.focus();
            }
        });

        // Override showScreen to handle video fullscreen
        const originalShowScreen = showScreen;
        showScreen = function(screenName) {
            originalShowScreen(screenName);
            
            if (screenName === 'video') {
                // Find the video URL for this choice
                let videoUrlToPlay = '';
                for (let choice of screenChoices) {
                    if (previousScreen === choice.screenId) {
                        videoUrlToPlay = choice.videoUrl;
                        break;
                    }
                }
                
                // Load the appropriate video player
                const videoContainer = document.getElementById('video-container');
                videoContainer.innerHTML = getVideoPlayerHTML(videoUrlToPlay);
                
                // Request fullscreen after video loads
                setTimeout(() => {
                    if (videoContainer.requestFullscreen) {
                        videoContainer.requestFullscreen().catch(err => {
                            console.log('Fullscreen request failed:', err);
                        });
                    } else if (videoContainer.webkitRequestFullscreen) {
                        videoContainer.webkitRequestFullscreen();
                    }
                }, 800);
            } else {
                // Clean up video container when leaving video screen
                const videoContainer = document.getElementById('video-container');
                videoContainer.innerHTML = '';
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                }
            }
        };
    </script>
</body>
</html>
